<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DUCAR Priority Studio — Uganda MoWT</title>
<meta name="description" content="DUCAR maintenance prioritisation, budget scenario analysis and GIS decision support tool for Uganda district, urban and community access roads."/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{
  --bg-primary:#0d1117;--bg-sidebar:#161b22;--bg-card:#1c2230;--bg-card-hover:#232b3e;
  --border:#30363d;--text-main:#e6edf3;--text-muted:#8b949e;--text-dim:#484f58;
  --brand:#1a3a5c;--brand-light:#2563eb;--accent:#f59e0b;
  --green:#22c55e;--amber:#f59e0b;--red:#ef4444;--blue:#3b82f6;--sidebar-width:240px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg-primary);color:var(--text-main);display:flex;height:100vh;overflow:hidden}
#sidebar{width:var(--sidebar-width);min-width:var(--sidebar-width);background:var(--bg-sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow-y:auto;z-index:10}
.sidebar-header{padding:20px 16px 16px;border-bottom:1px solid var(--border)}
.sidebar-logo{font-size:15px;font-weight:700;color:var(--text-main);letter-spacing:.4px}
.sidebar-sub{font-size:11px;color:var(--text-muted);margin-top:2px}
.sidebar-nav{padding:8px 0;flex:1}
.nav-section{padding:10px 16px 4px;font-size:10px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 16px;cursor:pointer;font-size:13px;color:var(--text-muted);transition:all .15s;border-left:3px solid transparent;text-decoration:none}
.nav-item:hover{background:var(--bg-card);color:var(--text-main)}
.nav-item.active{background:var(--bg-card);color:var(--text-main);border-left-color:var(--brand-light)}
.nav-icon{font-size:15px;width:18px;text-align:center}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--text-dim)}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:52px;background:var(--bg-sidebar);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0}
.topbar-title{font-size:15px;font-weight:600;color:var(--text-main)}
.topbar-badge{font-size:11px;padding:2px 8px;border-radius:12px;background:rgba(37,99,235,.2);color:#60a5fa;font-weight:600}
.topbar-right{margin-left:auto;font-size:12px;color:var(--text-muted)}
.content{flex:1;overflow-y:auto;padding:24px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.kpi-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:16px;border-top:3px solid var(--border)}
.kpi-card.green{border-top-color:var(--green)}.kpi-card.amber{border-top-color:var(--amber)}.kpi-card.red{border-top-color:var(--red)}.kpi-card.blue{border-top-color:var(--blue)}
.kpi-icon{font-size:20px;margin-bottom:8px}
.kpi-value{font-size:26px;font-weight:700;color:var(--text-main);line-height:1}
.kpi-label{font-size:12px;color:var(--text-muted);margin-top:4px}
.kpi-sub{font-size:11px;color:var(--text-dim);margin-top:2px}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.chart-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:0}
.chart-card.full{grid-column:1/-1;margin-bottom:24px}
.chart-title{font-size:13px;font-weight:600;color:var(--text-main);margin-bottom:4px}
.chart-sub{font-size:11px;color:var(--text-muted);margin-bottom:16px}
.chart-wrap{height:240px;position:relative}
.table-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:24px}
.table-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.table-title{font-size:13px;font-weight:600;color:var(--text-main)}
.table-count{font-size:11px;color:var(--text-muted);padding:2px 8px;background:rgba(255,255,255,.06);border-radius:10px}
.search-input{background:var(--bg-primary);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--text-main);outline:none;width:200px}
.search-input:focus{border-color:var(--brand-light)}
.filter-select{background:var(--bg-primary);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:12px;color:var(--text-main);outline:none}
.table-wrap{overflow-x:auto;max-height:460px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{position:sticky;top:0;background:var(--bg-sidebar);padding:10px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;user-select:none}
thead th:hover{color:var(--text-main)}
tbody tr{border-bottom:1px solid rgba(255,255,255,.04)}
tbody tr:hover{background:var(--bg-card-hover)}
tbody td{padding:9px 12px;color:var(--text-main)}
.badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-good{background:rgba(34,197,94,.15);color:#4ade80}
.badge-fair{background:rgba(245,158,11,.15);color:#fbbf24}
.badge-poor{background:rgba(239,68,68,.15);color:#f87171}
.badge-unclassified{background:rgba(139,148,158,.15);color:#8b949e}
.badge-bituminous{background:rgba(59,130,246,.15);color:#60a5fa}
.badge-gravel{background:rgba(245,158,11,.15);color:#fbbf24}
.badge-earth{background:rgba(239,68,68,.15);color:#f87171}
.loading{display:flex;align-items:center;justify-content:center;height:400px;flex-direction:column;gap:12px}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--brand-light);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--text-muted);font-size:13px}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.legend{position:absolute;bottom:16px;right:16px;background:rgba(13,17,23,.9);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:11px;z-index:1000;pointer-events:none}
.legend-item{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.legend-item:last-child{margin-bottom:0}
.legend-dot{width:16px;height:4px;border-radius:2px}
.section-head{margin-bottom:20px}
.section-title{font-size:18px;font-weight:700;color:var(--text-main)}
.section-sub{font-size:13px;color:var(--text-muted);margin-top:3px}
#mapContainer{height:520px;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.map-btn{padding:5px 12px;border-radius:5px;cursor:pointer;font-size:12px;transition:all .15s}
.map-btn.active{border:1px solid var(--brand-light);background:rgba(37,99,235,.2);color:#60a5fa}
.map-btn.inactive{border:1px solid var(--border);background:transparent;color:var(--text-muted)}
.pager-btn{background:var(--bg-primary);border:1px solid var(--border);color:var(--text-muted);padding:4px 10px;border-radius:5px;cursor:pointer;font-size:12py}
</style>
</head>
<body>
<div id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">🛣️ DUCAR Studio</div>
    <div class="sidebar-sub">Uganda MoWT · DUCAR Network</div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section">Overview</div>
    <a class="nav-item active" data-view="dashboard" onclick="showView('dashboard');return false">
      <span class="nav-icon">📊</span> Dashboard
    </a>
    <div class="nav-section">Road Network</div>
    <a class="nav-item" data-view="registry" onclick="showView('registry');return false">
      <span class="nav-icon">🗂️</span> Link Registry
    </a>
    <a class="nav-item" data-view="condition" onclick="showView('condition');return false">
      <span class="nav-icon">📉</span> Condition
    </a>
    <a class="nav-item" data-view="traffic" onclick="showView('traffic');return false">
      <span class="nav-icon">🚗</span> Traffic
    </a>
    <div class="nav-section">Spatial</div>
    <a class="nav-item" data-view="admin" onclick="showView('admin');return false">
      <span class="nav-icon">📍</span> Admin Coverage
    </a>
    <a class="nav-item" data-view="map" onclick="showView('map');return false">
      <span class="nav-icon">🗺️</span> Map View
    </a>
  </nav>
  <div class="sidebar-footer">DUCAR Priority Studio v2025 · Uganda MoWT</div>
</div>

<div id="main">
  <div class="topbar">
    <div class="topbar-title" id="topbarTitle">Dashboard</div>
    <span class="topbar-badge" id="topbarBadge">DUCAR Network</span>
    <div class="topbar-right" id="topbarRight">Loading data…</div>
  </div>
  <div class="content" id="content">
    <div class="loading"><div class="spinner"></div><div class="loading-text">Loading DUCAR network data…</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ────────────────────────────────────────────────────────────
// State
// ────────────────────────────────────────────────────────────
const BASE = (function(){
  var p = location.pathname;
  var m = p.match(/^(\/[^\/]+\/)/);
  if(m && m[1] !== '/') return m[1];
  return './';
})();
var SUMMARY = null, REGISTRY = null, GEOJSON = null;
var chartInst = {};
var leafletMap = null, geojsonLayer = null;
var mapMode = 'condition';
var regSortCol='length_km', regSortAsc=false;
var regFilter={search:'',district:'',ourface:'',condition:''};
var regPage=0;
var adminSortCol='total_length_km', adminSortAsc=false, adminSearchStr='';
var REG_PAGE = 100;

// ────────────────────────────────────────────────────────────
// Utils
// ────────────────────────────────────────────────────────────
function fmt(n){return n!=null?Number(n).toLocaleString():'—';}
function fmtKm(n){return n!=null?(n/1000).toFixed(1)+'k km':'—';}
function fmtKmR(n){return n!=null?Number(n).toFixed(1)+' km':'—';}
function pct(a,b){return b>0?(a/b*100).toFixed(1)+'%':'—';}
function condColor(c){return {Good:'#22c55e',Fair:'#f59e0b',Poor:'#ef4444',Unclassified:'#6b7280'}[c]||'#6b7280';}
function surfColor(s){return {Bituminous:'#3b82f6',Gravel:'#f59e0b',Earth:'#ef4444'}[s]||'#6b7280';}
function condBadge(c){var m={Good:'badge-good',Fair:'badge-fair',Poor:'badge-poor',Unclassified:'badge-unclassified'};return '<span class="badge '+(m[c]||'badge-unclassified')+'">'+(c||'—')+'</span>';}
function surfBadge(s){var m={Bituminous:'badge-bituminous',Gravel:'badge-gravel',Earth:'badge-earth'};return '<span class="badge '+(m[s]||'badge-unclassified')+'">'+(s||'—')+'</span>';}
function clearCharts(){Object.values(chartInst).forEach(function(c){c.destroy();});chartInst={};}
var CHART_DEFAULTS={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#8b949e',font:{size:11}}}},scales:{x:{ticks:{color:'#8b949e'},grid:{color:'#21262d'}},y:{ticks:{color:'#8b949e'},grid:{color:'#21262d'}}}};

// ────────────────────────────────────────────────────────────
// Data loading
// ────────────────────────────────────────────────────────────
function loadData(){
  Promise.all([
    fetch(BASE+'data/ducar_2025_summary.json').then(function(r){return r.json();}),
    fetch(BASE+'data/uganda_link_level_master_registry.json').then(function(r){return r.json();}),
    fetch(BASE+'data/ducar_2025_routes_web.geojson').then(function(r){return r.json();}).catch(function(){return null;})
  ]).then(function(results){
    SUMMARY=results[0]; REGISTRY=results[1]; GEOJSON=results[2];
    var t=fmt(SUMMARY.total_links)+' links · '+fmtKm(SUMMARY.total_length_km)+' · '+fmt(SUMMARY.districts_count)+' districts';
    document.getElementById('topbarRight').textContent=t;
    showView('dashboard');
  }).catch(function(e){
    document.getElementById('content').innerHTML='<div class="loading"><div style="color:#f87171;font-size:28px">⚠️</div><div class="loading-text">Error: '+e.message+'</div></div>';
  });
}

// ────────────────────────────────────────────────────────────
// Navigation
// ────────────────────────────────────────────────────────────
function showView(view){
  document.querySelectorAll('.nav-item').forEach(function(el){
    el.classList.toggle('active', el.dataset.view===view);
  });
  var titles={dashboard:'Dashboard',registry:'Link Registry',condition:'Condition Dashboard',traffic:'Traffic Dashboard',admin:'Admin Coverage',map:'Map View'};
  document.getElementById('topbarTitle').textContent=titles[view]||view;
  if(!SUMMARY) return;
  clearCharts();
  if(view==='dashboard') renderDashboard();
  else if(view==='registry') renderRegistry();
  else if(view==='condition') renderCondition();
  else if(view==='traffic') renderTraffic();
  else if(view==='admin') renderAdmin();
  else if(view==='map') renderMap();
}

// ────────────────────────────────────────────────────────────
// DASHBOARD
// ────────────────────────────────────────────────────────────
function renderDashboard(){
  var s=SUMMARY, total=s.total_length_km;
  var cGet=function(n){return (s.by_condition.find(function(c){return c.name===n;})||{}).length_km||0;};
  var sGet=function(n){return (s.by_surface.find(function(x){return x.name===n;})||{}).length_km||0;};
  var goodKm=cGet('Good'),fairKm=cGet('Fair'),poorKm=cGet('Poor'),unclKm=cGet('Unclassified');
  var bitKm=sGet('Bituminous'),gravKm=sGet('Gravel'),earthKm=sGet('Earth');
  var links=REGISTRY.links_sample||[];
  var wA=links.filter(function(l){return l.aadt>0;});
  var avgAadt=wA.length?Math.round(wA.reduce(function(a,l){return a+l.aadt;},0)/wA.length):0;
  var admins=REGISTRY.administrative_unit_summaries||[];
  var top15=((s.by_district||[]).filter(function(d){return d.name!=='UNASSIGNED';})).slice(0,15);

  document.getElementById('content').innerHTML=
    '<div class="section-head"><div class="section-title">Network Overview</div><div class="section-sub">Uganda DUCAR network · FY 2025/26 · Source: MoWT DUCAR data</div></div>'+
    '<div class="kpi-grid" style="grid-template-columns:repeat(3,1fr)">'+
      kpiCard('blue','🔗',fmt(s.total_links),'Total Road Links','DUCAR network segments')+
      kpiCard('blue','📏',(total/1000).toFixed(0)+'k km','Total Length',fmt(s.districts_count)+' districts')+
      kpiCard('blue','🏘️',fmt(s.districts_count),'Districts','Administrative units')+
      kpiCard('green','✅',pct(goodKm,total),'Good Condition',fmtKmR(goodKm))+
      kpiCard('amber','⚠️',pct(fairKm,total),'Fair Condition',fmtKmR(fairKm))+
      kpiCard('red','🔴',pct(poorKm,total),'Poor Condition',fmtKmR(poorKm))+
    '</div>'+
    '<div class="chart-grid">'+
      '<div class="chart-card"><div class="chart-title">Condition Distribution</div><div class="chart-sub">Percentage of network km by condition class</div><div class="chart-wrap"><canvas id="c_cond"></canvas></div></div>'+
      '<div class="chart-card"><div class="chart-title">Surface Type</div><div class="chart-sub">Network km by pavement type</div><div class="chart-wrap"><canvas id="c_surf"></canvas></div></div>'+
    '</div>'+
    '<div class="chart-card full"><div class="chart-title">Top 15 Districts by Road Length</div><div class="chart-sub">DUCAR road km broken down by condition class</div><div style="height:280px"><canvas id="c_dist"></canvas></div></div>'+
    '<div class="chart-card" style="margin-bottom:24px"><div class="chart-title">Condition vs Surface Matrix</div><div class="chart-sub">Road km by surface type and condition (estimated from network proportions)</div>'+
    '<div class="table-wrap" style="max-height:none">'+
    '<table><thead><tr><th>Surface</th><th>Total km</th><th>% Network</th><th style="color:#4ade80">Good km (est.)</th><th style="color:#fbbf24">Fair km (est.)</th><th style="color:#f87171">Poor km (est.)</th></tr></thead><tbody>'+
    ['Bituminous','Gravel','Earth'].map(function(sf){
      var km=sGet(sf), gPct=goodKm/total, fPct=fairKm/total, pPct=poorKm/total;
      return '<tr><td>'+surfBadge(sf)+'</td><td>'+fmtKmR(km)+'</td><td>'+pct(km,total)+'</td>'+
        '<td style="color:#4ade80">'+fmtKmR(km*gPct)+'</td>'+
        '<td style="color:#fbbf24">'+fmtKmR(km*fPct)+'</td>'+
        '<td style="color:#f87171">'+fmtKmR(km*pPct)+'</td></tr>';
    }).join('')+'</tbody></table></div></div>';

  chartInst['cond']=new Chart(document.getElementById('c_cond'),{type:'doughnut',data:{
    labels:['Good','Fair','Poor','Unclassified'],
    datasets:[{data:[goodKm,fairKm,poorKm,unclKm],backgroundColor:['#22c55e','#f59e0b','#ef4444','#6b7280'],borderWidth:1,borderColor:'#1c2230'}]
  },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#8b949e',font:{size:11}}}}}});

  chartInst['surf']=new Chart(document.getElementById('c_surf'),{type:'doughnut',data:{
    labels:['Bituminous','Gravel','Earth'],
    datasets:[{data:[bitKm,gravKm,earthKm],backgroundColor:['#3b82f6','#f59e0b','#ef4444'],borderWidth:1,borderColor:'#1c2230'}]
  },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#8b949e',font:{size:11}}}}}});

  chartInst['dist']=new Chart(document.getElementById('c_dist'),{type:'bar',data:{
    labels:top15.map(function(d){return d.name;}),
    datasets:[
      {label:'Good',data:top15.map(function(d){return d.good_km||0;}),backgroundColor:'#22c55e',stack:'s'},
      {label:'Fair',data:top15.map(function(d){return d.fair_km||0;}),backgroundColor:'#f59e0b',stack:'s'},
      {label:'Poor',data:top15.map(function(d){return d.poor_km||0;}),backgroundColor:'#ef4444',stack:'s'}
    ]
  },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#8b949e',font:{size:11}}}},scales:{x:{ticks:{color:'#8b949e',font:{size:10},maxRotation:40},grid:{color:'#21262d'}},y:{ticks:{color:'#8b949e'},grid:{color:'#21262d'},stacked:true}}}});
}

function kpiCard(cls,icon,val,label,sub){
  return '<div class="kpi-card '+cls+'"><div class="kpi-icon">'+icon+'</div><div class="kpi-value">'+val+'</div><div class="kpi-label">'+label+'</div><div class="kpi-sub">'+sub+'</div></div>';
}

// ────────────────────────────────────────────────────────────
// LINK REGISTRY
// ────────────────────────────────────────────────────────────
function renderRegistry(){
  var links=REGISTRY.links_sample||[];
  var districts=[...new Set(links.map(function(l){return l.district;}).filter(Boolean))].sort();
  var surfaces=[...new Set(links.map(function(l){return l.surface_type;}).filter(Boolean))].sort();
  var conditions=[...new Set(links.map(function(l){return l.pms_condition;}).filter(Boolean))].sort();
  regFilter={search:'',district:'',surface:'',condition:''};
  regPage=0;
  document.getElementById('content').innerHTML=
    '<div class="section-head"><div class="section-title">Link Registry</div><div class="section-sub">'+fmt(REGISTRY.total_links)+' total road links in the DUCAR network</div></div>'+
    '<div class="table-card">'+
    '<div class="table-header">'+
      '<span class="table-title">Road Links</span>'+
      '<span class="table-count" id="regCnt">'+fmt(links.length)+' shown</span>'+
      '<input class="search-input" type="text" placeholder="Search name, link ID, district…" oninput="regSearch(this.value)"/>'+
      '<select class="filter-select" onchange="regFC(\'district\',this.value)"><option value="">All Districts</option>'+districts.map(function(d){return '<option>'+d+'</option>';}).join('')+'</select>'+
      '<select class="filter-select" onchange="regFC(\'surface\',this.value)"><option value="">All Surfaces</option>'+surfaces.map(function(s){return '<option>'+s+'</option>';}).join('')+'</select>'+
      '<select class="filter-select" onchange="regFC(\'condition\',this.value)"><option value="">All Conditions</option>'+conditions.map(function(c){return '<option>'+c+'</option>';}).join('')+'</select>'+
    '</div>'+
    '<div class="table-wrap"><table><thead><tr>'+
      '<th onclick="regSort(\'link_id\')">Link ID ↕</th>'+
      '<th onclick="regSort(\'road_name\')">Road Name ↕</th>'+
      '<th onclick="regSort(\'district\')">District ↕</th>'+
      '<th onclick="regSort(\'subcounty\')">Subcounty ↕</th>'+
      '<th onclick="regSort(\'surface_type\')">Surface ↕</th>'+
      '<th onclick="regSort(\'pms_condition\')">Condition ↕</th>'+
      '<th onclick="regSort(\'length_km\')" style="text-align:right">Length km ↕</th>'+
      '<th onclick="regSort(\'aadt\')" style="text-align:right">AADT ↕</th>'+
      '<th onclick="regSort(\'speed_kmh\')" style="text-align:right">Speed ↕</th>'+
      '<th onclick="regSort(\'mowt_functional_class\')">Class ↕</th>'+
    '</tr></thead><tbody id="regBody"></tbody></table></div>'+
    '<div style="padding:10px 20px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px">'+
      '<button class="pager-btn" onclick="regPrev()">← Prev</button>'+
      '<span id="regPager" style="font-size:12px;color:var(--text-muted)"></span>'+
      '<button class="pager-btn" onclick="regNext()">Next →</button>'+
    '</div></div>';
  refreshRegTable();
}
function getRegFiltered(){
  var l=REGISTRY.links_sample||[];
  var s=regFilter.search.toLowerCase();
  if(s) l=l.filter(function(x){return (x.road_name||'').toLowerCase().indexOf(s)>-1||(x.link_id||'').toLowerCase().indexOf(s)>-1||(x.district||'').toLowerCase().indexOf(s)>-1;});
  if(regFilter.district) l=l.filter(function(x){return x.district===regFilter.district;});
  if(regFilter.surface) l=l.filter(function(x){return x.surface_type===regFilter.surface;});
  if(regFilter.condition) l=l.filter(function(x){return x.pms_condition===regFilter.condition;});
  return l.sort(function(a,b){
    var av=a[regSortCol]||0, bv=b[regSortCol]||0;
    if(typeof av==='string') return regSortAsc?av.localeCompare(bv):bv.localeCompare(av);
    return regSortAsc?av-bv:bv-av;
  });
}
function refreshRegTable(){
  var f=getRegFiltered();
  var p=f.slice(regPage*REG_PAGE,(regPage+1)*REG_PAGE);
  var b=document.getElementById('regBody');
  if(!b)return;
  b.innerHTML=p.map(function(l){

      '<td>'+condBadge(l.pms_condition)+'</td>'+
      '<td style="text-align:right">'+(l.length_km!=null?l.length_km.toFixed(2):'—')+'</td>'+
      '<td style="text-align:right">'+(l.aadt!=null?fmt(l.aadt):'—')+'</td>'+
      '<td style="text-align:right">'+(l.speed_kmh!=null?l.speed_kmh.toFixed(1):'—')+'</td>'+
      '<td style="font-size:11px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(l.mowt_functional_class||'—')+'</td>'+
    '</tr>';
  }).join('');
  var cnt=document.getElementById('regCnt');
  if(cnt)cnt.textContent=fmt(f.length)+' shown';
  var pager=document.getElementById('regPager');
  if(pager)pager.textContent='Page '+(regPage+1)+' of '+Math.max(1,Math.ceil(f.length/REG_PAGE))+' ('+fmt(f.length)+' links)';
}
function regSearch(v){regFilter.search=v;regPage=0;refreshRegTable();}
function regFC(k,v){regFilter[k]=v;regPage=0;refreshRegTable();}
function regSort(c){if(regSortCol===c)regSortAsc=!regSortAsc;else{regSortCol=c;regSortAsc=true;}refreshRegTable();}
function regPrev(){if(regPage>0){regPage--;refreshRegTable();}}
function regNext(){var f=getRegFiltered();if((regPage+1)*REG_PAGE<f.length){regPage++;refreshRegTable();}}

function renderTraffic(){
  var links=REGISTRY.links_sample||[];
  var admins=REGISTRY.administrative_unit_summaries||[];
  var wA=links.filter(function(l){return l.aadt>0;});
  var avgAadt=wA.length?Math.round(wA.reduce(function(a,l){return a+l.aadt;},0)/wA.length):0;
  var maxAadt=wA.length?Math.max.apply(null,wA.map(function(l){return l.aadt;})):0;
  var highTraf=links.filter(function(l){return l.aadt>1000;}).length;
  var topLinks=wA.slice().sort(function(a,b){return b.aadt-a.aadt;}).slice(0,20);
  var topDist=admins.slice().sort(function(a,b){return (b.average_pcu||0)-(a.average_pcu||0);}).slice(0,15);

  var buckets=[{l:0,h:100},{l:100,h:500},{l:500,h:1000},{l:1000,h:2000},{l:2000,h:5000},{l:5000,h:1e9}];
  var bCounts=buckets.map(function(b){return wA.filter(function(l){return l.aadt>=b.l&&l.aadt<b.h;}).length;});
  var bLabels=buckets.map(function(b){return b.h===1e9?'>'+b.l:b.l+'-'+b.h;});

  document.getElementById('content').innerHTML=
    '<div class="section-head"><div class="section-title">Traffic Dashboard</div><div class="section-sub">AADT and PCU analysis across the DUCAR network</div></div>'+
    '<div class="kpi-grid" style="grid-template-columns:repeat(4,1fr)">'+
      kpiCard('blue','🚗',fmt(avgAadt),'Avg AADT','Ann. avg daily traffic')+
      kpiCard('red','🔝',fmt(maxAadt),'Peak AADT','Highest single link')+
      kpiCard('amber','⚡',fmt(highTraf),'High-Traffic Links','AADT > 1,000 vpd')+
      kpiCard('blue','🏘️',fmt(admins.length),'Districts','With traffic data')+
    '</div>'+
    '<div class="chart-grid">'+
      '<div class="chart-card"><div class="chart-title">AADT Distribution</div><div class="chart-sub">Link count by traffic volume band (vpd)</div><div class="chart-wrap"><canvas id="c_adist"></canvas></div></div>'+
      '<div class="chart-card"><div class="chart-title">Avg AADT by Surface Type</div><div class="chart-sub">Mean annual average daily traffic by pavement class</div><div class="chart-wrap"><canvas id="c_asurf"></canvas></div></div>'+
    '</div>'+
    '<div class="chart-card full"><div class="chart-title">Top 15 Districts by Avg PCU</div><div class="chart-sub">Passenger Car Units — measure of mixed-traffic volume</div><div style="height:260px"><canvas id="c_dpcu"></canvas></div></div>'+
    '<div class="table-card"><div class="table-header"><span class="table-title">Top 20 Busiest Links</span><span class="table-count">Sorted by AADT</span></div>'+
    '<div class="table-wrap"><table><thead><tr><th>Rank</th><th>Link ID</th><th>Road Name</th><th>District</th><th>Surface</th><th>Condition</th><th style="text-align:right">AADT</th><th style="text-align:right">PCU</th><th style="text-align:right">Speed km/h</th></tr></thead>'+
    '<tbody>'+topLinks.map(function(l,i){
      return '<tr>'+
        '<td style="font-weight:700;color:#60a5fa">#'+(i+1)+'</td>'+
        '<td style="font-family:monospace;font-size:11px">'+(l.link_id||'—')+'</td>'+
        '<td style="font-weight:500">'+(l.road_name||'—')+'</td>'+
        '<td>'+(l.district||'—')+'</td>'+
        '<td>'+surfBadge(l.surface_type)+'</td>'+
        '<td>'+condBadge(l.pms_condition)+'</td>'+
        '<td style="text-align:right;font-weight:700;color:#60a5fa">'+fmt(l.aadt)+'</td>'+
        '<td style="text-align:right">'+fmt(l.pcu)+'</td>'+
        '<td style="text-align:right">'+(l.speed_kmh!=null?l.speed_kmh.toFixed(1):'—')+'</td>'+
      '</tr>';
    }).join('')+'</tbody></table></div></div>';

  chartInst['adist']=new Chart(document.getElementById('c_adist'),{type:'bar',data:{
    labels:bLabels,datasets:[{label:'Links',data:bCounts,backgroundColor:'#3b82f6'}]
  },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#8b949e',font:{size:10}},grid:{color:'#21262d'}},y:{ticks:{color:'#8b949e'},grid:{color:'#21262d'}}}}});

  var surfs=['Bituminous','Gravel','Earth'];
  var avgBySurf=surfs.map(function(sf){
    var ls=wA.filter(function(l){return l.surface_type===sf;});
    return ls.length?Math.round(ls.reduce(function(a,l){return a+l.aadt;},0)/ls.length):0;
  });
  chartInst['asurf']=new Chart(document.getElementById('c_asurf'),{type:'bar',data:{
    labels:surfs,datasets:[{label:'Avg AADT',data:avgBySurf,backgroundColor:['#3b82f6','#f59e0b','#ef4444']}]
  },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#8b949e'},grid:{color:'#21262d'}},y:{ticks:{color:'#8b949e'},grid:{color:'#21262d'}}}}});

  chartInst['dpcu']=new Chart(document.getElementById('c_dpcu'),{type:'bar',data:{
    labels:topDist.map(function(d){return d.district;}),
    datasets:[{label:'Avg PCU',data:topDist.map(function(d){return d.average_pcu||0;}),backgroundColor:'#8b5cf6'}]

}

function setMapMode(mode){
  mapMode=mode;
  ['Cond','Surf'].forEach(function(s){
    var el=document.getElementById('btn'+s);
    if(el){ el.className='map-btn '+(((mode==='condition')===( s==='Cond'))?'active':'inactive'); }
  });
  if(geojsonLayer) geojsonLayer.setStyle(featStyle);
  updateMapLegend();

function featStyle(f){
  var p=f.properties;
  return {color: mapMode==='condition'?condColor(p.p):surfColor(p.s), weight:2, opacity:0.85};
}
function updateMapLegend(){
  var el=document.getElementById('mapLegend');
  if(!el)return;
  var items=mapMode==='condition'
    ?[{l:'Good',c:'#22c55e'},{l:'Fair',c:'#f59e0b'},{l:'Poor',c:'#ef4444'},{l:'Unclassified',c:'#6b7280'}]
    :[{l:'Bituminous',c:'#3b82f6'},{l:'Gravel',c:'#f59e0b'},{l:'Earth',c:'#ef4444'}];
  el.innerHTML=items.map(function(i){return '<div class="legend-item"><div class="legend-dot" style="background:'+i.c+'"></div><span style="color:#e6edf3">'+i.l+'</span></div>';}).join('');
}
function initMap(){
  if(leafletMap){leafletMap.remove();leafletMap=null;geojsonLayer=null;}
  leafletMap=L.map('mapContainer',{zoomControl:true}).setView([1.3733,32.2903],7);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
    attribution:'&copy; <a href="https://osm.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
    subdomains:'abcd',maxZoom:19
  }).addTo(leafletMap);
  updateMapLegend();
  if(GEOJSON){
    geojsonLayer=L.geoJSON(GEOJSON,{
      style:featStyle,
      onEachFeature:function(feat,layer){
        var p=feat.properties;
        layer.bindPopup(
          '<div style="font-family:sans-serif;min-width:190px">'+
          '<b style="font-size:13px">'+(p.n||'Unknown Road')+'</b><br>'+
          '<span style="font-size:11px;color:#666">Code: '+(p.c||'—')+'</span><br>'+
          '<table style="font-size:12px;margin-top:4px;border-collapse:collapse">'+
          '<tr><td style="padding:1px 4px 1px 0;color:#666">District</td><td><b>'+(p.d||'—')+'</b></td></tr>'+
          '<tr><td style="padding:1px 4px 1px 0;color:#666">Length</td><td><b>'+(p.l!=null?p.l.toFixed(2):'—')+' km</b></td></tr>'+
          '<tr><td style="padding:1px 4px 1px 0;color:#666">Surface</td><td><b>'+(p.s||'—')+'</b></td></tr>'+
          '<tr><td style="padding:1px 4px 1px 0;color:#666">Condition</td><td><b>'+(p.p||'—')+'</b></td></tr>'+
          '</table></div>'
        );
        layer.on('mouseover',function(){layer.setStyle({weight:4,opacity:1});});
        layer.on('mouseout',function(){if(geojsonLayer)geojsonLayer.resetStyle(layer);});
      }
    }).addTo(leafletMap);
  }
}

// ────────────────────────────────────────────────────────────
// Boot
// ────────────────────────────────────────────────────────────
loadData();
</script>
