  <script>
  (function() {
    var ROAD_STYLES = {
      classM:    { color: '#FFD700', weight: 3.0, opacity: 0.95 },
      classA:    { color: '#E53935', weight: 2.5, opacity: 0.95 },
      classB:    { color: '#FB8C00', weight: 2.0, opacity: 0.90 },
      classC:    { color: '#FDD835', weight: 1.5, opacity: 0.85 },
      district:  { color: '#43A047', weight: 1.0, opacity: 0.80 },
      urban:     { color: '#00ACC1', weight: 1.0, opacity: 0.80 },
      car:       { color: '#9E9E9E', weight: 0.5, opacity: 0.70 },
      footpath:  { color: '#9E9E9E', weight: 0.5, opacity: 0.00 }
    };

    var MAP_LAYERS = [
      { file: './data/roads_class_m.geojson',  style: ROAD_STYLES.classM,   name: 'Class M â Motorways/Expressways' },
      { file: './data/roads_class_a.geojson',  style: ROAD_STYLES.classA,   name: 'Class A â National Primary' },
      { file: './data/roads_class_b.geojson',  style: ROAD_STYLES.classB,   name: 'Class B â National Secondary' },
      { file: './data/roads_class_c.geojson',  style: ROAD_STYLES.classC,   name: 'Class C â National Tertiary' },
      { file: './data/roads_district.geojson', style: ROAD_STYLES.district, name: 'District Roads' },
      { file: './data/roads_urban.geojson',    style: ROAD_STYLES.urban,    name: 'Urban Roads' },
      { file: './data/roads_car.geojson',      style: ROAD_STYLES.car,      name: 'Community Access Roads' },
      { file: './data/roads_footpath.geojson', style: ROAD_STYLES.footpath, name: 'Footpaths (non-vehicular)' }
    ];

    function initRoadLayers(map) {
      var control = L.control.layers(null, null, { collapsed: false, position: 'topright' });
      MAP_LAYERS.forEach(function(layer) {
        fetch(layer.file)
          .then(function(r) { return r.ok ? r.json() : null; })
          .then(function(data) {
            if (!data) return;
            var geoLayer = L.geoJSON(data, {
              style: function() { return layer.style; },
              onEachFeature: function(feature, lyr) {
                var p = feature.properties || {};
                lyr.bindTooltip(
                  '<strong>' + (p.name || p.road_name || 'Road') + '</strong><br>' +
                  (p.functional_class || layer.name) + '<br>' +
                  'Surface: ' + (p.surface_type || 'Unknown') +
                  (p.length_km ? '<br>Length: ' + Number(p.length_km).toFixed(2) + ' km' : ''),
                  { sticky: true, opacity: 0.9 }
                );
              }
            });
            if (layer.style.opacity > 0) geoLayer.addTo(map);
            control.addOverlay(geoLayer, layer.name);
          })
          .catch(function() { /* file not yet uploaded â skip silently */ });
      });
      control.addTo(map);
    }

function attachToMap() {
  // Leaflet 1.9 does not populate L.Map._maps — hook prototype instead
  function tryHook() {
    if (window.L && L.Map && !window._leafletHooked) {
      window._leafletHooked = true;
      var _oi = L.Map.prototype.initialize;
      L.Map.prototype.initialize = function() {
        _oi.apply(this, arguments);
        window._leafletMap = this;
      };
    }
  }
  tryHook();
  var attempts = 0;
  var check = setInterval(function() {
    attempts++;
    if (attempts > 120) { clearInterval(check); return; }
    tryHook();
    var m = window._leafletMap;
    if (!m) return;
    clearInterval(check);
    if (!window._roadsLoaded) {
      window._roadsLoaded = true;
      initRoadLayers(m);
    }
  }, 500);
}

    function wireButtons() {
      var root = document.getElementById('exhaustive-root');
      if (!root) return;

      // Chart PNG downloads (.chart-download)
      root.querySelectorAll('.chart-download:not([data-wired])').forEach(function(btn) {
        btn.setAttribute('data-wired', '1');
        btn.addEventListener('click', function() {
          var card = btn.closest('.chart-card, [class*="chart"], .kpi-card, [class*="card"]') || btn.parentElement;
          var canvas = card ? card.querySelector('canvas') : null;
          if (canvas) {
            var a = document.createElement('a');
            a.download = 'ducar-chart-' + Date.now() + '.png';
            a.href = canvas.toDataURL('image/png');
            a.click();
          } else if (typeof html2canvas !== 'undefined' && card) {
            html2canvas(card, { backgroundColor: '#1c2a3a', scale: 2 }).then(function(c) {
              var a = document.createElement('a');
              a.download = 'ducar-chart-' + Date.now() + '.png';
              a.href = c.toDataURL('image/png');
              a.click();
            });
          }
        });
      });

      // PDF downloads (.pdf-download)
      root.querySelectorAll('.pdf-download:not([data-wired])').forEach(function(btn) {
        btn.setAttribute('data-wired', '1');
        btn.addEventListener('click', function() {
          var target = btn.closest('[class*="section"], [class*="card"]') || root;
          if (typeof html2canvas === 'undefined') { alert('PDF library loading, please retry.'); return; }
          html2canvas(target, { backgroundColor: '#1c2a3a', scale: 1.5 }).then(function(canvas) {
            if (typeof window.jspdf !== 'undefined') {
              var jsPDF = window.jspdf.jsPDF;
              var doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a3' });
              var w = doc.internal.pageSize.getWidth() - 20;
              var h = (canvas.height / canvas.width) * w;
              doc.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', 10, 10, w, h);
              doc.save('ducar-report-' + new Date().toISOString().slice(0,10) + '.pdf');
            } else {
              var a = document.createElement('a');
              a.download = 'ducar-report-' + Date.now() + '.png';
              a.href = canvas.toDataURL('image/png');
              a.click();
            }
          });
        });
      });

      // Export button â trigger section export
      root.querySelectorAll('.export-btn:not([data-wired])').forEach(function(btn) {
        btn.setAttribute('data-wired', '1');
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          var menu = btn.nextElementSibling;
          if (menu && menu.classList.contains('export-menu')) {
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
          } else {
            // Fallback: screenshot the main content
            var shell = document.querySelector('.exhaustive-shell, #exhaustive-root');
            if (shell && typeof html2canvas !== 'undefined') {
              html2canvas(shell, { backgroundColor: '#0b141e', scale: 1.5 }).then(function(c) {
                var a = document.createElement('a');
                a.download = 'ducar-export-' + Date.now() + '.png';
                a.href = c.toDataURL('image/png');
                a.click();
              });
            }
          }
        });
      });

      // Filter select â update map display
      root.querySelectorAll('.top-action-select:not([data-wired])').forEach(function(sel) {
        sel.setAttribute('data-wired', '1');
        sel.addEventListener('change', function() {
          var val = sel.value;
          // Dispatch to exhaustive.js state if available
          if (window.state) { window.state.filterValue = val; }
          // Also dispatch custom event for map filtering
          document.dispatchEvent(new CustomEvent('ducar:filter', { detail: { roadClass: val } }));
        });
      });
    }

    // Re-wire buttons after every render (exhaustive.js re-renders on section change)
    function injectOfficialCharts() {
      if (document.getElementById('off-charts')) return;
      var root = document.getElementById('exhaustive-root');
      if (!root) return;
      var allText = root.innerText || '';
      if (allText.indexOf('OFFICIAL TOTAL ROAD HEADLINE') < 0) return;
      var mc = Array.from(root.querySelectorAll('.metric-card'));
      if (!mc.length) return;
      var par = mc[0].parentElement;
      if (!par) return;
      var sentinel = document.createElement('div');
      sentinel.id = 'off-charts';
      root.appendChild(sentinel);
      var R = 70; var C = 2 * Math.PI * R;
      var pKm = 56117.49; var uKm = 162835.98; var tKm = pKm + uKm;
      var pArc = (pKm / tKm * C).toFixed(2);
      var uArc = (C - pKm / tKm * C).toFixed(2);
      var wrap = document.createElement('div');
      wrap.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;padding:1.5rem 1.5rem 0;';
      var donSVG = '<svg width="220" height="220" viewBox="0 0 220 220" style="display:block;">' +
        '<circle cx="110" cy="110" r="70" fill="none" stroke="#1e3a5f" stroke-width="28"/>' +
        '<circle cx="110" cy="110" r="70" fill="none" stroke="#f59e0b" stroke-width="28" stroke-dasharray="' + pArc + ' ' + uArc + '" transform="rotate(-90 110 110)"/>' +
        '<text x="110" y="105" text-anchor="middle" fill="#f0f4f8" font-family="Inter,sans-serif" font-size="13" font-weight="600">218,953 km</text>' +
        '<text x="110" y="122" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10">national network</text>' +
        '</svg>';
      var legend = '<div style="display:flex;flex-direction:column;gap:1rem;justify-content:center;">' +
        '<div><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;"><span style="width:14px;height:14px;border-radius:50%;background:#f59e0b;display:inline-block;"></span>' +
        '<b style="color:#f0f4f8;">25.6% Paved</b></div><div style="color:#94a3b8;font-size:0.82rem;padding-left:22px;">56,117 km â Bituminous + Concrete</div></div>' +
        '<div><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;"><span style="width:14px;height:14px;border-radius:50%;background:#1e3a5f;border:1px solid #334155;display:inline-block;"></span>' +
        '<b style="color:#f0f4f8;">74.4% Unpaved</b></div><div style="color:#94a3b8;font-size:0.82rem;padding-left:22px;">162,836 km â Gravel + Earth</div></div>' +
        '</div>';
      var donutCard = '<div style="background:#1c2a3a;border-radius:12px;padding:1.5rem;">' +
        '<p style="color:#f0f4f8;font-size:0.8rem;letter-spacing:0.06em;text-transform:uppercase;font-weight:600;margin:0 0 1rem;">Paved vs Unpaved â Official National Network</p>' +
        '<div style="display:flex;align-items:center;gap:1.5rem;">' + donSVG + legend + '</div></div>';
      var cls = [{n:'Community Access (CAR)',k:117578.55,p:53.7,c:'#f59e0b'},{n:'Urban Roads',k:46795.41,p:21.4,c:'#00ACC1'},{n:'District Roads',k:33442.76,p:15.3,c:'#43A047'},{n:'National Roads',k:21136.75,p:9.6,c:'#3b82f6'}];
      var bars = cls.map(function(cl) {
        var w = (cl.k / 117578.55 * 100).toFixed(1);
        return '<div style="margin-bottom:0.9rem;"><div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span style="color:#94a3b8;font-size:0.78rem;">' + cl.n + '</span>' +
          '<span style="color:#f0f4f8;font-size:0.78rem;font-weight:600;">' + cl.k.toLocaleString(undefined,{maximumFractionDigits:0}) + ' km <span style="color:#64748b;">(' + cl.p + '%)</span></span></div>' +
          '<div style="background:#0f1923;border-radius:4px;height:10px;"><div style="background:' + cl.c + ';height:10px;border-radius:4px;width:' + w + '%;"></div></div></div>';
      }).join('');
      var classCard = '<div style="background:#1c2a3a;border-radius:12px;padding:1.5rem;">' +
        '<p style="color:#f0f4f8;font-size:0.8rem;letter-spacing:0.06em;text-transform:uppercase;font-weight:600;margin:0 0 1rem;">Functional Class Breakdown â 218,953 km Total</p>' +
        bars +
        '<div style="margin-top:0.75rem;border-top:1px solid rgba(241,159,11,0.18);padding-top:0.6rem;color:#475569;font-size:0.7rem;">Source: MoWT Strategic Plan 2026. National 21,137 km + DUCAR 197,817 km</div></div>';
      wrap.innerHTML = donutCard + classCard;
      par.insertBefore(wrap, mc[mc.length - 1].nextSibling);
    }

    var observer = new MutationObserver(function() {
      wireButtons();
      attachToMap();
      injectOfficialCharts();
    });

    document.addEventListener('DOMContentLoaded', function() {
      var root = document.getElementById('exhaustive-root');
      if (root) {
        observer.observe(root, { childList: true, subtree: false });
        wireButtons();
        attachToMap();
      }
    });
    window.addEventListener('load', function() {
      wireButtons();
      attachToMap();
    });
  })();
  </script>
