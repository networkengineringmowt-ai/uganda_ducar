name: Uptime Check
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check site uptime
        run: |
          URL="https://networkengineringmowt-ai.github.io/${{ github.event.repository.name }}/"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
          echo "Status: $STATUS for $URL"
          [ "$STATUS" = "200" ] || exit 1
